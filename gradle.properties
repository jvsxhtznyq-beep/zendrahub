org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Target game. Minecraft 26.1 and later are unobfuscated: no mappings, Java 25.
minecraft_version=26.1.2

# Fabric toolchain. CI looks up the newest builds for minecraft_version on
# Fabric's metadata servers and passes them with -P, so these are only the
# fallback when building somewhere that cannot reach those servers.
loader_version=0.18.6
fabric_api_version=0.145.4+26.1.2
loom_version=1.15-SNAPSHOT

mod_version=0.1.0
maven_group=com.zendrahub
