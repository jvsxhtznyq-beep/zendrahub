plugins {
    id 'java-library'
    id 'application'
}

// The mod recompiles these sources with Java 25; targeting 21 keeps the
// standalone simulator runnable on any current LTS JDK.
tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.zendrahub.evolve.core.cli.EvolveCli'
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
        showStandardStreams = false
    }
}

// ./gradlew -PcoreOnly :core:demo  - the abundant vs. depleted forest comparison
tasks.register('demo', JavaExec) {
    group = 'evolve'
    description = 'Runs the milestone-1 divergence demonstration.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    args 'demo'
}

// ./gradlew -PcoreOnly :core:bench - simulation throughput, memory and save/load timings
tasks.register('bench', JavaExec) {
    group = 'evolve'
    description = 'Runs the simulation benchmarks.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    args 'bench'
}
